<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - EventSphere</title>
    <link rel="stylesheet" href="../css/connexion.css">
</head>

<body>

    <div class="auth-container">

        <h1>EventSphere</h1>
        <h2>Créer un compte</h2>
        <p class="desc">
            Rejoignez EventSphere pour organiser vos événements
        </p>

        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <input type="password" id="confirm" placeholder="Confirmer le mot de passe">

        <button id="signup-btn">S’inscrire</button>

        <a href="login.html">Déjà un compte ? Connexion</a>

    </div>

    <script src="../js/auth.js"></script>

</body>
</html>
