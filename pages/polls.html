<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mes sondages - EventSphere</title>
    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/polls.css" />
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>EventSphere</h2>
        <nav>
          <a href="dashboard.html">Accueil</a>
          <a href="events.html">Mes événements</a>
          <a href="polls.html" class="active">Sondages</a>
        </nav>
        <button id="logout" class="logout-btn">Déconnexion</button>
      </aside>

      <main class="content">
        <div class="topbar">
          <h2>Mes sondages</h2>
          <div class="avatar" id="avatar"></div>
        </div>

        <div class="polls-header">
          <div class="filters">
           <button class="filter-btn active">Tous</button>
           <button class="filter-btn">Mes sondages</button>
           <button class="filter-btn">Votés</button>
           <button class="filter-btn">Non votés</button>
          </div>
        </div>

        <div class="poll-grid">
          <!-- Grille remplie dynamiquement -->
        </div>
      </main>
    </div>

    <script type="module" src="../js/pages/polls.js"></script>
    <script type="module" src="../js/pages/profil.js"></script>
    <script type="module" src="../js/pages/logout.js"></script>
  </body>
</html>
