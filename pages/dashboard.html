<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventSphere - Dashboard</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/general.css">
</head>

<body>
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2 class="logo">EventSphere</h2>

      <nav>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="events.html">Mes événements</a>
        <a href="polls.html">Sondages</a>
      </nav>
       <button id="logout" class="logout-btn">Déconnexion</button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">
      <div class="topbar">
        <h2>Dashboard</h2>
      <div class="avatar" id="avatar"></div>
      </div>

    <div class="dashboard-section">

      <div class="events-list">
        <!-- Les cartes d'événements seront ajoutées ici dynamiquement -->
      </div>
       <div class="polls-list">
          <h2>Sondages récents</h2>
          <!-- Les cartes de sondages seront ajoutées ici dynamiquement -->
      </div>
    </div>
  </main>
</div>

  <script type="module" src="../js/pages/dashboard.js"></script>
  <script type="module" src="../js/pages/profil.js"></script>
  <script type="module" src="../js/pages/logout.js"></script>
</body>
</html>
